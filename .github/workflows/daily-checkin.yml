name: Daily Check-in

on:
  schedule:
    # GitHub Actions 使用 UTC 时间，UTC 01:17 = 北京时间每天 09:17
    # 定时任务在高峰期可能延迟几分钟到几十分钟，属正常现象
    - cron: '17 1 * * *'
  # 临时触发器：用于本次验证，验证后会移除
  push: {}
  # 允许在 Actions 页面手动点 "Run workflow" 立即测试
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure git identity
        run: |
          git config user.name "Richardzhao-271"
          git config user.email "188760039+Richardzhao-271@users.noreply.github.com"

      - name: Daily commit (check-in)
        run: |
          echo "checked-in at $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> checkin.log
          git add checkin.log
          git commit -m "chore: daily check-in $(date -u '+%Y-%m-%d')" || echo "nothing to commit"
          git push

      - name: Result
        run: echo "Daily check-in finished at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"